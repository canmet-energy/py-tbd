[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-tbd"
dynamic = ["version"]
description = "Thermal Bridging & Derating (TBD) for OpenStudio — native Python port of the rd2/tbd Ruby gem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
  { name = "Denis Bourgeois & Dan Macumber", email = "denis@rd2.ca" },
]
keywords = ["openstudio", "thermal", "bridging", "derating", "energy"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "openstudio",
  # EXACT pins on this branch (btap review, 2026-08-28): the branch is a
  # verification baseline, and a future osut/oslg release changing the
  # installed engine without a consumer commit would defeat the SHA pin.
  "oslg==0.4.0",
  "osut==0.9.1",
  # py-topolys 0.1.0 IS commit 36470305 (its v0.1.0 tag sits at exactly
  # that SHA) — the D-79 Option A pin survives PyPI publication as an
  # exact version pin, since PyPI forbids direct git references.
  "py-topolys==0.1.0",
  "jsonschema>=4",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/rd2/tbd"
Source = "https://github.com/rd2/tbd"
Upstream = "https://github.com/rd2/tbd"

[tool.hatch.metadata]

[tool.hatch.version]
path = "src/tbd/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tbd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "unit: fast per-method parity tests (no OpenStudio model required where possible)",
  "e2e: end-to-end ports of the Ruby RSpec suite",
]

[tool.coverage.run]
source = ["tbd"]
omit = ["*/_compat.py"]  # dependency shims, exercised indirectly

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
